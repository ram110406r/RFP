# Dokploy variant of docker-compose.prod.yml.
#
# Two differences from the standalone file, both forced by Dokploy owning the
# host's ingress:
#
#   1. Nothing publishes ports. Dokploy's Traefik already holds 80/443, so a
#      container binding them would fail to start. Traefik reaches us over the
#      shared `dokploy-network` instead.
#
#   2. Caddy no longer terminates TLS — Traefik does that. Caddy stays in the
#      stack as an internal proxy because it is what enforces the password gate
#      and the /api-vs-/ split, and that arrangement is already tested. Set
#      SITE_ADDRESS=:80 so it serves plain HTTP to Traefik.
#
# In Dokploy: create a Compose application, point it at this file, then add one
# domain targeting the `caddy` service on port 80. Everything else stays
# private on the internal network.

networks:
  # Created by Dokploy at install time. Only caddy joins it — that is what
  # keeps postgres, the API, and the SSR server unreachable from outside.
  dokploy-network:
    external: true
  internal:

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - rfp_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/legacy-api/Dockerfile
    working_dir: /repo/packages/db
    command: ["bun", "run", "db:migrate"]
    networks: [internal]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/legacy-api/Dockerfile
    working_dir: /repo/packages/db
    command: ["bun", "run", "db:ensure-seed"]
    networks: [internal]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/legacy-api/Dockerfile
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PORT: 4000
      CORS_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL is required}
      DEV_AUTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:4000/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/legacy-web/Dockerfile
    restart: unless-stopped
    networks: [internal]
    environment:
      PORT: 3000
      # SSR must bypass the password gate, so it calls the API container
      # directly rather than going back out through Traefik.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Both networks: dokploy-network to receive traffic from Traefik,
    # internal to reach web and api.
    networks: [dokploy-network, internal]
    environment:
      SITE_ADDRESS: ":80"
      # ACME_EMAIL is deliberately NOT set. Traefik terminates TLS here, so
      # Caddy needs no ACME account — and setting it empty would override the
      # Caddyfile's default and fail to parse. Leaving it unset is the fix.
      DEMO_USER: ${DEMO_USER:?DEMO_USER is required}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?DEMO_PASSWORD_HASH is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - rfp_os_caddy_data:/data
      - rfp_os_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  rfp_os_postgres_data:
  rfp_os_caddy_data:
  rfp_os_caddy_config:
