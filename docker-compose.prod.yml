# Production compose for the private demo.
#
# Deliberately smaller than docker-compose.yml (the local dev stack): the
# legacy API talks to Postgres and nothing else — no Redis, no OpenSearch, no
# object storage — so running those here would be cost and attack surface for
# no benefit. Add them back when apps/api takes over.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Note that only caddy publishes ports. Postgres, the API, and the SSR server
# are reachable only on the internal network, behind the password gate.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - rfp_os_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies packages/db/migrations, then exits. The API waits for it
  # to succeed, so a failed migration stops the deploy instead of booting an
  # API against a half-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: apps/legacy-api/Dockerfile
    working_dir: /repo/packages/db
    command: ["bun", "run", "db:migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/legacy-api/Dockerfile
    working_dir: /repo/packages/db
    command: ["bun", "run", "db:ensure-seed"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/legacy-api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PORT: 4000
      # Requests reach the API same-origin through Caddy, so this is only a
      # backstop for anything that does send an Origin header.
      CORS_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL is required}
      DEV_AUTH_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:4000/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/legacy-web/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      # SSR runs ensureSession() during render. It must bypass Caddy — the
      # password gate would 401 it — so it calls the API container directly.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      DEMO_USER: ${DEMO_USER:?DEMO_USER is required}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?DEMO_PASSWORD_HASH is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - rfp_os_prod_caddy_data:/data
      - rfp_os_prod_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  rfp_os_prod_postgres_data:
  rfp_os_prod_caddy_data:
  rfp_os_prod_caddy_config:
