# Production compose for the updated dashboard.
#
# The public entrypoint is the Next.js web service. It proxies /api/v1
# requests to the Nest API over the internal Docker network. The API now owns
# dashboard summary, onboarding, and the rest of the production surface.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Redis and MinIO are included because the Nest API's production configuration
# expects a queue backend and S3-compatible storage credentials.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - rfp_os_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - rfp_os_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-rfpos}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-rfpos_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL is required}
    volumes:
      - rfp_os_prod_minio_data:/data

  minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-rfpos}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-rfpos_dev_password}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-rfp-os-documents}
    command:
      [
        "sh",
        "-c",
        "until mc alias set local http://minio:9000 \"$${STORAGE_ACCESS_KEY_ID}\" \"$${STORAGE_SECRET_ACCESS_KEY}\"; do sleep 2; done; mc mb --ignore-existing \"local/$${STORAGE_BUCKET}\"; mc anonymous set none \"local/$${STORAGE_BUCKET}\"",
      ]
    depends_on:
      minio:
        condition: service_started

  # One-shot: applies packages/db/migrations, then exits. The API waits for it
  # to succeed, so a failed migration stops the deploy instead of booting an
  # API against a half-migrated schema.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /repo/packages/db
    command: ["bun", "run", "db:migrate"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /repo/packages/db
    command: ["bun", "run", "db:ensure-seed"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      NODE_ENV: production
      API_PORT: 4000
      CORS_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL is required}
      FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?NEXT_PUBLIC_FIREBASE_PROJECT_ID is required}
      BETTER_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-rfp-os_local_auth_secret_20260830_fallback}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      # This must be the HTTPS MinIO/S3 URL reachable by the browser. The API
      # uses STORAGE_ENDPOINT for Docker-internal access and this value only
      # when signing browser upload/download URLs.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-rfp-os-documents}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-rfpos}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-rfpos_dev_password}
      STORAGE_FORCE_PATH_STYLE: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://127.0.0.1:4000/ready'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:?STORAGE_PUBLIC_ENDPOINT is required}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-rfp-os-documents}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-rfpos}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-rfpos_dev_password}
      STORAGE_FORCE_PATH_STYLE: "true"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
        NEXT_PUBLIC_FIREBASE_USE_EMULATORS: ${NEXT_PUBLIC_FIREBASE_USE_EMULATORS:-false}
        NEXT_PUBLIC_ALLOW_GUEST_UI: ${NEXT_PUBLIC_ALLOW_GUEST_UI:-false}
        NEXT_PUBLIC_APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
        NEXT_PUBLIC_APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
      NEXT_PUBLIC_FIREBASE_USE_EMULATORS: ${NEXT_PUBLIC_FIREBASE_USE_EMULATORS:-false}
      NEXT_PUBLIC_ALLOW_GUEST_UI: ${NEXT_PUBLIC_ALLOW_GUEST_UI:-false}
      NEXT_PUBLIC_APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      NEXT_PUBLIC_APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  rfp_os_prod_postgres_data:
  rfp_os_prod_redis_data:
  rfp_os_prod_minio_data:
