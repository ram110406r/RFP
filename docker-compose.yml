services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rfp-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfpos
      POSTGRES_PASSWORD: rfpos_dev_password
      POSTGRES_DB: rfpos
    ports:
      # Mapped to a non-default host port so this doesn't collide with a
      # Postgres instance you might already have running locally.
      - "55432:5432"
    volumes:
      - rfp_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfpos -d rfpos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rfp-os-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - rfp_os_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rfp-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rfpos
      MINIO_ROOT_PASSWORD: rfpos_dev_password
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:3001
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - rfp_os_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: rfp-os-minio-init
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "[minio-init] waiting for MinIO"
        for i in $$(seq 1 60); do
          if mc alias set local http://minio:9000 "$${STORAGE_ACCESS_KEY_ID}" "$${STORAGE_SECRET_ACCESS_KEY}"; then
            mc mb --ignore-existing "local/$${STORAGE_BUCKET}"
            echo "[minio-init] bucket ready: $${STORAGE_BUCKET}"
            exit 0
          fi
          echo "[minio-init] MinIO not ready, retry $${i}/60"
          sleep 2
        done
        echo "[minio-init] failed to connect to MinIO"
        exit 1
    environment:
      STORAGE_ACCESS_KEY_ID: rfpos
      STORAGE_SECRET_ACCESS_KEY: rfpos_dev_password
      STORAGE_BUCKET: rfp-os-documents
    depends_on:
      minio:
        condition: service_started

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: rfp-os-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "45200:9200"
    volumes:
      - rfp_os_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rfp_os_postgres_data:
  rfp_os_redis_data:
  rfp_os_minio_data:
  rfp_os_opensearch_data:
