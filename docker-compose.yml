services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rfp-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfpos
      POSTGRES_PASSWORD: rfpos_dev_password
      POSTGRES_DB: rfpos
    ports:
      # Mapped to a non-default host port so this doesn't collide with a
      # Postgres instance you might already have running locally.
      - "55432:5432"
    volumes:
      - rfp_os_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfpos -d rfpos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rfp-os-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - rfp_os_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rfp-os-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rfpos
      MINIO_ROOT_PASSWORD: rfpos_dev_password
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - rfp_os_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: rfp-os-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "45200:9200"
    volumes:
      - rfp_os_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rfp_os_postgres_data:
  rfp_os_redis_data:
  rfp_os_minio_data:
  rfp_os_opensearch_data:
